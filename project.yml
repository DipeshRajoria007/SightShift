# Generates SightShift.xcodeproj: run `xcodegen generate` (or `make project`) after editing.
name: SightShift
options:
  bundleIdPrefix: app.sightshift
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  SightShiftCore:
    path: Packages/SightShiftCore
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.0"
targets:
  SightShift:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: SightShiftCore
        product: SightShiftCore
    settings:
      base:
        PRODUCT_NAME: SightShift
        PRODUCT_BUNDLE_IDENTIFIER: app.sightshift.SightShift
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/SightShift.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        DEAD_CODE_STRIPPING: YES
    scheme: {}
